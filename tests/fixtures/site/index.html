<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture Site — Home</title>
  <meta name="description" content="The home page of the worker test fixture.">
  <meta property="og:site_name" content="Fixture Site">
</head>
<body>
  <h1>Fixture Site</h1>
  <p data-marker="FIXTURE::index">FIXTURE::index</p>

  <nav>
    <a href="/about.html">About</a>
    <a href="about.html">About again (relative — same page, must not be crawled twice)</a>
    <a href="/contact.html">Contact</a>
    <a href="/docs/guide.html">Guide</a>

    <!-- The href carries an HTML entity. The real URL is ?a=1&b=2; requesting the literal
         "&amp;" 404s. This is the orfanakisbike.gr bug (41 of 50 pages lost). -->
    <a href="/search.html?a=1&amp;b=2">Search (entity-encoded query)</a>

    <!-- Duplicated path segment, a common relative-link quirk: /en/en/team.html must
         normalize to /en/team.html, which is the page that actually exists. -->
    <a href="/en/en/team.html">Team (duplicated segment)</a>

    <!-- Fragment only: the same page, must not be queued again. -->
    <a href="/about.html#section-2">About, anchored</a>
  </nav>

  <!-- Assets. None of these may ever be fetched: each wasted fetch on a stylesheet is a page
       slot and a timeout. The cache-busting query is why the check is on the PATH. -->
  <link rel="stylesheet" href="/assets/style.css?ver=3.7.6">
  <script src="/assets/app.js?v=9"></script>
  <a href="/assets/brochure.pdf">Brochure (PDF)</a>
  <a href="/assets/photo.jpg">A photo</a>
  <a href="/min?f=app.js">Asset behind a query parameter</a>

  <!-- Never followed: other schemes, and other hosts. -->
  <a href="mailto:hello@example.com">Email us</a>
  <a href="tel:+301234567">Call us</a>
  <a href="javascript:void(0)">JS link</a>
  <a href="https://example.com/offsite.html">Another site entirely</a>
</body>
</html>
