# Run the worker on a node (laptop / Raspberry Pi). Usually driven by bootstrap.sh, but manual is:
#   cp config.example.yaml config.yaml  &&  edit api_base_url + api_key
#   docker compose up -d --build
#
# network_mode: host — so the container resolves `.local` names (the API box) via the LAN and has no
# ports to bind (the worker is outbound-only). This also lets you point api_base_url at
# http://<host>.local:5099 and survive the server's IP drifting.
#
# Scale N pullers on one node (host networking is fine — no ports bound):
#   docker compose up -d --build --scale worker=4
services:
  worker:
    build: .
    restart: unless-stopped          # + `systemctl enable docker` ⇒ survives reboot
    network_mode: host
    environment:
      CRAWLFAST_WORKER_CONFIG: "/app/config.yaml"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Host avahi socket → so nss-mdns in the container can resolve `.local` names (avahi-daemon
      # owns udp/5353 on the host, so standalone in-container mDNS can't; it must use this socket).
      # Harmless if the host has no avahi (file just won't exist / won't be used).
      - /run/avahi-daemon/socket:/run/avahi-daemon/socket
      # Per-lead/client JSONL result logs + the page spool on a HOST dir shared by every worker
      # replica — so they survive container rebuilds and `post_logs.py` can upload the whole node's
      # backlog from one place (each task's file is uniquely named, so replicas never collide).
      - ./logs:/app/logs
      - ./.page-spool:/app/.page-spool
